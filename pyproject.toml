[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoku-sat-solving"
version = "0.1.0"
description = "Sudoku SAT encoding and exact solver comparison research scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-sat>=1.8.dev13"]

[project.optional-dependencies]
ortools = ["ortools>=9.10"]
ibm = ["docplex>=2.25", "cplex>=22.1"]
gurobi = ["gurobipy>=11"]
all = ["ortools>=9.10", "docplex>=2.25", "cplex>=22.1", "gurobipy>=11"]

[tool.setuptools.packages.find]
where = ["src"]
